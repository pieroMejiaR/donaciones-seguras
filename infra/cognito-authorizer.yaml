AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Plataforma de Donaciones Seguras - Modulo de Identidad y Seguridad Zero Trust (Cognito + JWT Authorizer)
  Responsable: Paolo Ramirez (Identidad y Seguridad Zero Trust)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - academic
      - prod
    Description: Entorno de despliegue

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173,http://localhost:5173/callback"
    Description: URLs de callback permitidas para la SPA

  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173,http://localhost:5173/logout"
    Description: URLs de redireccion tras logout

  DomainPrefix:
    Type: String
    Default: donaciones-seguras
    AllowedPattern: "^(?!.*(aws|amazon|cognito))[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: Prefijo del dominio de Cognito (https://PREFIJO.auth.REGION.amazoncognito.com). Es unico en la region y no puede contener aws, amazon ni cognito.

Resources:
  # ============================================================================
  # 1. AWS Cognito User Pool
  # ============================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "donaciones-user-pool-${Environment}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      # MFA obligatorio con TOTP (HU-11). Con "ON", el managed login guia a cada usuario a
      # configurar su app autenticadora la primera vez; con "OPTIONAL" no ofrece hacerlo, y un
      # GESTOR o AUDITOR no podria activarlo. El trigger exige el TOTP a GESTOR y AUDITOR y
      # deja mfa_verified en el access token, que es lo que revisa Lambda (requireRoleWithMfa).
      MfaConfiguration: "ON"
      EnabledMfas:
        - "SOFTWARE_TOKEN_MFA"
      # Trigger V2_0: personaliza el access token. Requiere el plan Essentials o Plus, el mismo
      # que exige el managed login (version 2) que ya usa este pool.
      LambdaConfig:
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt PreTokenGenerationFunction.Arn
          LambdaVersion: V2_0
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true


  # ============================================================================
  # 1b. Trigger Pre-Token Generation V2.0 (HU-11, T13, T14)
  # Codigo: api/src/handlers/preTokenGeneration.ts, empaquetado con npm run build.
  # ============================================================================
  PreTokenGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Trigger Pre-Token Generation V2.0. Exige TOTP a GESTOR y AUDITOR y agrega mfa_verified al access token (HU-11)
      CodeUri: ../api/dist/preTokenGeneration
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 5
      Role: !GetAtt PreTokenGenerationRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref PreTokenGenerationLogGroup

  PreTokenGenerationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/preTokenGeneration
      RetentionInDays: 14

  PreTokenGenerationRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol del trigger Pre-Token Generation. Logs propios; AdminGetUser va en una politica aparte.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PreTokenGenerationLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PreTokenGenerationLogGroup.Arn

  # Politica aparte del rol: el pool depende de la funcion (LambdaConfig) y esta politica depende
  # del pool, asi que dentro del rol formaria una dependencia circular.
  PreTokenGenerationLeerMfa:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PreTokenGenerationLeerMfa
      Roles:
        - !Ref PreTokenGenerationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LeerFactoresDelUsuario
            Effect: Allow
            Action: cognito-idp:AdminGetUser
            Resource: !GetAtt UserPool.Arn

  PreTokenGenerationPermiso:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreTokenGenerationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ============================================================================
  # 2. Resource Server con Scopes personalizados
  # ============================================================================
  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: "api"
      Name: "Plataforma Donaciones API"
      Scopes:
        - ScopeName: "projects.write"
          ScopeDescription: "Crear y publicar proyectos de recaudacion (HU-08)"
        - ScopeName: "donations.*"
          ScopeDescription: "Operaciones de donaciones: crear intencion, historial y simular (HU-05, HU-06, HU-07)"
        - ScopeName: "audit.read"
          ScopeDescription: "Lectura de eventos de auditoria para AUDITOR (HU-10)"

  # ============================================================================
  # 3. User Pool App Client para SPA (Public Client con PKCE, sin secretos)
  # ============================================================================
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "donaciones-spa-client-${Environment}"
      GenerateSecret: false # Public client (SPA en navegador)
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code # Authorization Code Grant con PKCE obligatorio
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - "api/projects.write"
        - "api/donations.*"
        - "api/audit.read"
      # Sin proveedor no hay con que iniciar sesion: el login responde "Invalid request".
      # COGNITO es el directorio de usuarios del propio pool.
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      # Limitacion de tiempo de vida del Access Token (HU-03 / RNF-HU-02: 15 minutos o menos)
      AccessTokenValidity: 15
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # ============================================================================
  # 3b. Dominio y estilo del managed login
  # El dominio da los endpoints /oauth2/authorize, /oauth2/token, /oauth2/revoke y /logout
  # que usa la SPA (Authorization Code con PKCE). Con managed login (version 2) hace falta
  # un estilo: sin el, la pagina de inicio de sesion responde "Login pages unavailable".
  # Se usa el estilo que trae Cognito por defecto.
  # ============================================================================
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  ManagedLoginStyle:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  # ============================================================================
  # 4. Cognito User Pool Groups (RBAC)
  # ============================================================================
  DonanteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: "DONANTE"
      Description: "Rol Donante: registrar intenciones de donacion, historial propio y simulacion"
      Precedence: 3

  GestorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: "GESTOR"
      Description: "Rol Gestor: crear borradores y publicar proyectos de recaudacion"
      Precedence: 2

  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: "AUDITOR"
      Description: "Rol Auditor: lectura de auditoria seudonimizada con MFA obligatorio"
      Precedence: 1

  # ============================================================================
  # 5. Definicion de Authorizer JWT para API Gateway HTTP API
  # ============================================================================
  # En SAM / CloudFormation este bloque se vincula al recurso AWS::Serverless::HttpApi
  # o se instancia directamente como AWS::ApiGatewayV2::Authorizer:
  #
  # HttpApiJwtAuthorizer:
  #   Type: AWS::ApiGatewayV2::Authorizer
  #   Properties:
  #     ApiId: !Ref HttpApi
  #     AuthorizerType: JWT
  #     Name: CognitoJwtAuthorizer
  #     IdentitySource:
  #       - "$request.header.Authorization"
  #     JwtConfiguration:
  #       Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  #       Audience:
  #         - !Ref UserPoolClient

Outputs:
  UserPoolId:
    Description: ID del Cognito User Pool
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolArn:
    Description: ARN del Cognito User Pool
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  UserPoolClientId:
    Description: ID del App Client publico (sin secreto) para la SPA
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  CognitoIssuerUrl:
    Description: URL del emisor (Issuer) para el JWT Authorizer y OIDC
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoIssuerUrl"

  CognitoDomainUrl:
    Description: URL base del dominio de Cognito (managed login), sin barra final. Va en VITE_OIDC_DOMAIN de la SPA
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoDomainUrl"
