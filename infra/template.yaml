AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Plataforma de Donaciones Seguras: API HTTP, funciones Lambda y tablas DynamoDB.
  El JWT authorizer usa el User Pool del stack de Cognito (cognito-authorizer.yaml).
  Responsable: Piero Mejia (lider tecnico y DevOps).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - academic
    Description: Stage del API. POST /v1/donations/{id}/simulate solo existe en academic (CA-06.1).

  CognitoStackName:
    Type: String
    Default: donaciones-cognito
    Description: Stack desplegado con cognito-authorizer.yaml; de sus exportaciones salen el emisor y el client_id.

  DevOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origen del servidor de desarrollo de la SPA, permitido por CORS.

  SpaOrigin:
    Type: String
    Default: http://localhost:4173
    Description: Origen de la SPA publicada, permitido por CORS. La URL de CloudFront desde el dia 5; por ahora, vite preview.

  ThrottlingRateLimit:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Solicitudes por segundo sostenidas en cada ruta.

  ThrottlingBurstLimit:
    Type: Number
    Default: 20
    MinValue: 10
    Description: Rafaga maxima en cada ruta. Al menos 10 para la prueba de concurrencia T08.

Conditions:
  IsAcademic: !Equals [!Ref Stage, academic]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Handler: index.handler
    MemorySize: 256
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        STAGE: !Ref Stage
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ============================================================================
  # API HTTP con JWT authorizer de Cognito, CORS y throttling
  # ============================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref DevOrigin
          - !Ref SpaOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
          - idempotency-key
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::ImportValue: !Sub ${CognitoStackName}-CognitoIssuerUrl
              audience:
                - Fn::ImportValue: !Sub ${CognitoStackName}-UserPoolClientId

  # ============================================================================
  # Tablas DynamoDB. Claves genericas (pk, gsi1pk, gsi1sk): el modulo de backend
  # decide que guarda en cada una. Nombres generados por CloudFormation para que
  # cada integrante pueda tener su propio stack.
  # ============================================================================
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================================
  # Funciones: una por ruta de la matriz de control de acceso (docs/threat-model.md).
  # Cada una escribe en su propio grupo de logs con retencion de 14 dias, para que
  # sam delete no deje grupos huerfanos.
  # Cada funcion tiene su propio rol IAM (RNF-HU-03): solo escribe en su grupo de logs y
  # recibe las acciones DynamoDB exactas sobre las tablas que usa (docs/data-model.md),
  # sin comodines de accion ni de recurso. No usa AWSLambdaBasicExecutionRole porque
  # concede logs sobre todos los recursos.
  # El codigo sale de npm run build: api/dist/<funcion>/index.mjs.
  # ============================================================================
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /v1/health
      CodeUri: ../api/dist/health
      Role: !GetAtt HealthRole.Arn
      LoggingConfig:
        LogGroup: !Ref HealthLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/health
            Auth:
              Authorizer: NONE

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/health
      RetentionInDays: 14

  HealthRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de HealthFunction. Solo escribe en su grupo de logs; no toca datos.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: HealthAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt HealthLogGroup.Arn

  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /v1/projects (HU-01)
      CodeUri: ../api/dist/listProjects
      Role: !GetAtt ListProjectsRole.Arn
      LoggingConfig:
        LogGroup: !Ref ListProjectsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects
            Auth:
              Authorizer: NONE

  ListProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/listProjects
      RetentionInDays: 14

  ListProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de ListProjectsFunction. Logs propios y Query sobre el indice gsi1 de Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ListProjectsAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ListProjectsLogGroup.Arn
              - Sid: ConsultarCatalogo
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${ProjectsTable.Arn}/index/gsi1

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /v1/projects/{id} (HU-02)
      CodeUri: ../api/dist/getProject
      Role: !GetAtt GetProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects/{id}
            Auth:
              Authorizer: NONE

  GetProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/getProject
      RetentionInDays: 14

  GetProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de GetProjectFunction. Logs propios y GetItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetProjectAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt GetProjectLogGroup.Arn
              - Sid: LeerProyecto
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt ProjectsTable.Arn

  GetStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /v1/stats (HU-09)
      CodeUri: ../api/dist/getStats
      Role: !GetAtt GetStatsRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetStatsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/stats
            Auth:
              Authorizer: NONE

  GetStatsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/getStats
      RetentionInDays: 14

  GetStatsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de GetStatsFunction. Logs propios y Query sobre el indice gsi1 de Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetStatsAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt GetStatsLogGroup.Arn
              - Sid: ConsultarCatalogo
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${ProjectsTable.Arn}/index/gsi1

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /v1/projects (HU-08)
      CodeUri: ../api/dist/createProject
      Role: !GetAtt CreateProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref CreateProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
          AUDIT_TABLE: !Ref AuditEventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/projects
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/projects.write

  CreateProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/createProject
      RetentionInDays: 14

  CreateProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de CreateProjectFunction. Logs propios y PutItem sobre Projects y AuditEvents.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CreateProjectAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CreateProjectLogGroup.Arn
              - Sid: CrearProyectoYAuditoria
                Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !GetAtt ProjectsTable.Arn
                  - !GetAtt AuditEventsTable.Arn

  PublishProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /v1/projects/{id}/publish (HU-08)
      CodeUri: ../api/dist/publishProject
      Role: !GetAtt PublishProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref PublishProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
          AUDIT_TABLE: !Ref AuditEventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/projects/{id}/publish
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/projects.write

  PublishProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/publishProject
      RetentionInDays: 14

  PublishProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de PublishProjectFunction. Logs propios, leer y actualizar Projects, y PutItem sobre AuditEvents.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishProjectAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt PublishProjectLogGroup.Arn
              - Sid: LeerYPublicarProyecto
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ProjectsTable.Arn
              - Sid: EscribirAuditoria
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditEventsTable.Arn

  CreateDonationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /v1/donations (HU-05)
      CodeUri: ../api/dist/createDonation
      Role: !GetAtt CreateDonationRole.Arn
      LoggingConfig:
        LogGroup: !Ref CreateDonationLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
          DONATIONS_TABLE: !Ref DonationsTable
          IDEMPOTENCY_TABLE: !Ref IdempotencyTable
          AUDIT_TABLE: !Ref AuditEventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/donations
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/donations.*

  CreateDonationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/createDonation
      RetentionInDays: 14

  CreateDonationRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de CreateDonationFunction. Logs propios y los accesos de la transaccion de HU-05 (proyecto, idempotencia, donacion y auditoria).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CreateDonationAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CreateDonationLogGroup.Arn
              - Sid: VerificarProyecto
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt ProjectsTable.Arn
              - Sid: RegistroDeIdempotencia
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt IdempotencyTable.Arn
              - Sid: CrearDonacionYAuditoria
                Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !GetAtt DonationsTable.Arn
                  - !GetAtt AuditEventsTable.Arn

  # Solo existe en el stage academic (CA-06.1): la condicion quita la funcion y su ruta.
  SimulateDonationFunction:
    Type: AWS::Serverless::Function
    Condition: IsAcademic
    Properties:
      Description: POST /v1/donations/{id}/simulate (HU-06), solo en el stage academic
      CodeUri: ../api/dist/simulateDonation
      Role: !GetAtt SimulateDonationRole.Arn
      LoggingConfig:
        LogGroup: !Ref SimulateDonationLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
          DONATIONS_TABLE: !Ref DonationsTable
          AUDIT_TABLE: !Ref AuditEventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/donations/{id}/simulate
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/donations.*

  SimulateDonationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsAcademic
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/simulateDonation
      RetentionInDays: 14

  SimulateDonationRole:
    Type: AWS::IAM::Role
    Condition: IsAcademic
    Properties:
      Description: Rol de SimulateDonationFunction. Logs propios; leer y actualizar Donations y Projects (HU-06); PutItem sobre AuditEvents.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SimulateDonationAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SimulateDonationLogGroup.Arn
              - Sid: ConfirmarDonacionYAcumulado
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt DonationsTable.Arn
                  - !GetAtt ProjectsTable.Arn
              - Sid: EscribirAuditoria
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditEventsTable.Arn

  ListMyDonationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /v1/donations/me (HU-07)
      CodeUri: ../api/dist/listMyDonations
      Role: !GetAtt ListMyDonationsRole.Arn
      LoggingConfig:
        LogGroup: !Ref ListMyDonationsLogGroup
      Environment:
        Variables:
          DONATIONS_TABLE: !Ref DonationsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/donations/me
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - api/donations.*

  ListMyDonationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /donaciones/${AWS::StackName}/listMyDonations
      RetentionInDays: 14

  ListMyDonationsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Rol de ListMyDonationsFunction. Logs propios y Query sobre el indice gsi1 de Donations.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ListMyDonationsAcceso
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsPropios
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ListMyDonationsLogGroup.Arn
              - Sid: ConsultarHistorialPropio
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${DonationsTable.Arn}/index/gsi1

Outputs:
  ApiUrl:
    Description: URL base del API, incluido el stage
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  ProjectsTableName:
    Value: !Ref ProjectsTable

  DonationsTableName:
    Value: !Ref DonationsTable

  IdempotencyTableName:
    Value: !Ref IdempotencyTable

  AuditEventsTableName:
    Value: !Ref AuditEventsTable
