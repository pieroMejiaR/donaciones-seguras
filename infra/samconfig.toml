# Configuración de SAM CLI. Los comandos se ejecutan desde la carpeta infra/.
# No usar sam build: el código ya sale empaquetado de npm run build (api/dist).
version = 0.1

# Stack personal de cada integrante (Stage=dev, sin /simulate):
#   sam deploy --stack-name donaciones-<nombre>
[default.global.parameters]
region = "us-east-2"

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "Stage=dev CognitoStackName=donaciones-cognito"

# Stack compartido para la SPA y la demo (Stage=academic). Lo despliega Piero:
#   sam deploy --config-env academic
[academic.global.parameters]
region = "us-east-2"

[academic.deploy.parameters]
stack_name = "donaciones-academic"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "Stage=academic CognitoStackName=donaciones-cognito"

[academic.delete.parameters]
stack_name = "donaciones-academic"

# Stack de identidad compartido (cognito-authorizer.yaml). Se despliega una vez, antes que los demás:
#   sam deploy --config-env cognito
[cognito.global.parameters]
region = "us-east-2"

[cognito.deploy.parameters]
stack_name = "donaciones-cognito"
template_file = "cognito-authorizer.yaml"
resolve_s3 = true
confirm_changeset = true
# Las URL de la SPA publicada (CloudFront) se suman a las de localhost, que usa el desarrollo local.
# CallbackUrls necesita /callback; LogoutUrls, el origen sin barra final, que es lo que envia la SPA.
parameter_overrides = [
  "Environment=academic",
  "CallbackUrls=http://localhost:5173,http://localhost:5173/callback,https://d2kgpnaifzb84g.cloudfront.net/callback",
  "LogoutUrls=http://localhost:5173,http://localhost:5173/logout,https://d2kgpnaifzb84g.cloudfront.net",
]

[cognito.delete.parameters]
stack_name = "donaciones-cognito"

# CloudTrail de la cuenta (cloudtrail.yaml). Se despliega una vez, lo hace Piero:
#   sam deploy --config-env cloudtrail
[cloudtrail.global.parameters]
region = "us-east-2"

[cloudtrail.deploy.parameters]
stack_name = "donaciones-cloudtrail"
template_file = "cloudtrail.yaml"
resolve_s3 = true
confirm_changeset = true

[cloudtrail.delete.parameters]
stack_name = "donaciones-cloudtrail"
